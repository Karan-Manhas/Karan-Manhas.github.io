name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check HTML files
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          format: text

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          jobSummary: true
          output: lychee-results.md
          # Check portfolio URLs against this checkout, not an older Pages deployment.
          # Other projects on the same domain (e.g. ScreenTimeMonitor) stay online checks.
          args: >-
            --verbose --no-progress --include-fragments
            --max-retries 3 --retry-wait-time 2
            --index-files index.html
            --remap '^https://karan-manhas\.github\.io/(index\.html|technical_notes\.html|notes/[^?#]+\.html|social-card\.png|favicon\.svg)?$ file://${{ github.workspace }}/$1'
            './**/*.html'

      - name: Print link report
        if: always()
        run: |
          if [ -f lychee-results.md ]; then
            cat lychee-results.md
          fi
